name: Compilar NOVEX RISE (iOS)

# Se ejecuta cada vez que subes cambios a la rama main,
# o a mano desde la pestaña "Actions" → "Run workflow".
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: Mac de GitHub donde compilar
        type: choice
        default: macos-15-intel
        options: [macos-15-intel, macos-15, macos-26]

jobs:
  build:
    name: Compilar .ipa sin firmar
    # Las Mac Intel suelen tener menos cola que las Apple Silicon (arm64).
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 45

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Ver versión de Xcode
        run: xcodebuild -version

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar el proyecto de Xcode
        run: xcodegen generate

      - name: Compilar para iPhone (sin firma)
        run: |
          xcodebuild \
            -project NovexRise.xcodeproj \
            -scheme NovexRise \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Empaquetar NovexRise.ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NovexRise.app Payload/
          zip -qry NovexRise.ipa Payload
          ls -lh NovexRise.ipa

      - name: Publicar el .ipa para descargarlo
        uses: actions/upload-artifact@v4
        with:
          name: NovexRise-ipa
          path: NovexRise.ipa
          retention-days: 14
